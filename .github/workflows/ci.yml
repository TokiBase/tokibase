name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet -structtag=false ./...  # upstream test fixture has an intentional unexported tagged field
      - run: go test ./... -short
  test-rule-ast:
    # runs the filter/rule related suites through the AST + emitter path (TOKI_RULE_AST=1)
    runs-on: ubuntu-latest
    env:
      TOKI_RULE_AST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./kernel/rule/... ./tools/search/... ./kernel/... ./apis/... ./modules/... -short
  test-race:
    # data race detector on the kernel + sync suites (notify watcher / cleanup goroutines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./kernel/... ./modules/sync/... -short -race -p 2
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build solo (with UI)
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o out/toki-solo ./examples/base
      - name: build no_ui
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -tags no_ui -ldflags "-s -w" -o out/toki-noui ./examples/base
      - name: build solo with s3 replica backend
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -tags replica_s3 -ldflags "-s -w" -o out/toki-solo-s3 ./examples/base
      - name: size budget
        run: |
          # solo/cluster budgets come from profiles.txt; no_ui is an extra check (not a profile)
          budget() { awk -v p="$1" '$1==p {print $2}' profiles.txt; }
          bs=$(budget solo); bc=$(budget cluster); bn=43
          s=$(stat -c %s out/toki-solo); n=$(stat -c %s out/toki-noui); x=$(stat -c %s out/toki-solo-s3)
          echo "solo=$((s/1024/1024))MB (budget $bs) noui=$((n/1024/1024))MB (budget $bn) solo+s3=$((x/1024/1024))MB (budget $bc)"
          test -n "$bs" -a -n "$bc" || { echo "missing solo/cluster budget in profiles.txt"; exit 1; }
          test $s -le $((bs*1024*1024)) || { echo "solo over ${bs}MB budget"; exit 1; }
          test $n -le $((bn*1024*1024)) || { echo "no_ui over ${bn}MB budget"; exit 1; }
          test $x -le $((bc*1024*1024)) || { echo "solo+s3 over ${bc}MB budget"; exit 1; }
      - name: team size budget (team = solo tags, budget from profiles.txt)
        run: |
          bt=$(awk '$1=="team" {print $2}' profiles.txt)
          test -n "$bt" || { echo "missing team budget in profiles.txt"; exit 1; }
          t=$(stat -c %s out/toki-solo)
          echo "team=$((t/1024/1024))MB (budget $bt)"
          test $t -le $((bt*1024*1024)) || { echo "team over ${bt}MB budget"; exit 1; }
  profiles:
    # edge/nano tag sets and budgets come from profiles.txt (docs/PROFILES.md)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [edge, nano]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build ${{ matrix.profile }} (linux/${{ matrix.goarch }})
        run: make ${{ matrix.profile }} GOOS=linux GOARCH=${{ matrix.goarch }}
      - name: size budget
        run: |
          budget=$(awk -v p="${{ matrix.profile }}" '$1==p {print $2}' profiles.txt)
          size=$(stat -c %s out/toki-${{ matrix.profile }})
          echo "${{ matrix.profile }}/${{ matrix.goarch }}=$((size/1024/1024))MiB (budget ${budget}MiB)"
          test $size -le $((budget*1024*1024)) || { echo "${{ matrix.profile }} over ${budget}MiB budget"; exit 1; }
      - name: vet with the profile tags (catches stub drift)
        run: go vet -structtag=false -tags "$(awk -v p='${{ matrix.profile }}' '$1==p {for (i=3;i<=NF;i++) printf "%s%s", (i>3?",":""), $i}' profiles.txt)" ./...
      - name: stub builds (every module removed, each module removed)
        if: matrix.goarch == 'amd64' && matrix.profile == 'edge'
        run: go test -run 'TestProfile|TestEachStub|TestExamplePluginTags' -count=1 .
  embed:
    # in-process Go API + gomobile facade, nano tag set from profiles.txt; gomobile itself is not run in CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./embed/... ./mobile/... -short -race
      - name: nano tags
        run: |
          tags=$(awk '$1=="nano" {for (i=3;i<=NF;i++) printf "%s%s", (i>3?",":""), $i}' profiles.txt)
          go vet -structtag=false -tags "$tags" ./embed/... ./mobile/... ./examples/embed/...
          go test -tags "$tags" ./embed/... ./mobile/... -short
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: -c ./golangci.yml ./kernel/... ./core/...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: tests/e2e/run.sh
  e2e-dart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('tests/e2e/dart/pubspec.yaml') }}
      - run: tests/e2e/run-dart.sh
  failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: tests/e2e/failover.sh
  e2e-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: tests/e2e/sync.sh

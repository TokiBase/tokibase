name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet -structtag=false ./...  # upstream test fixture has an intentional unexported tagged field
      - run: go test ./... -short
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: build solo (with UI)
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o out/toki-solo ./examples/base
      - name: build no_ui
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -tags no_ui -ldflags "-s -w" -o out/toki-noui ./examples/base
      - name: build solo with s3 replica backend
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -tags replica_s3 -ldflags "-s -w" -o out/toki-solo-s3 ./examples/base
      - name: size budget
        run: |
          s=$(stat -c %s out/toki-solo); n=$(stat -c %s out/toki-noui); x=$(stat -c %s out/toki-solo-s3)
          echo "solo=$((s/1024/1024))MB noui=$((n/1024/1024))MB solo+s3=$((x/1024/1024))MB"
          test $s -le $((46*1024*1024)) || { echo "solo over 46MB budget"; exit 1; }
          test $n -le $((43*1024*1024)) || { echo "no_ui over 43MB budget"; exit 1; }
          test $x -le $((56*1024*1024)) || { echo "solo+s3 over 56MB budget"; exit 1; }
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: -c ./golangci.yml ./kernel/... ./core/...
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: tests/e2e/run.sh
  failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: tests/e2e/failover.sh

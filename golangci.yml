version: "2"
run:
  concurrency: 4
  timeout: 10m
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - depguard
    - gomodguard_v2
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - reassign
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        # the kernel must stay free from HTTP, process and UI concerns
        # (see docs/ARCHITECTURE.md and docs/PHASE0_KERNEL_SPLIT.md)
        kernel:
          files:
            - "**/kernel/**"
            - "!$test"
          deny:
            - pkg: net/http
              desc: the kernel must not depend on net/http (use the core package for HTTP bound code)
            - pkg: github.com/tokibase/tokibase/tools/router
              desc: the kernel must not depend on the HTTP router (use the core package)
            - pkg: github.com/tokibase/tokibase/core
              desc: the kernel must not import core (dependency direction is core -> kernel)
            - pkg: github.com/tokibase/tokibase/apis
              desc: the kernel must not import the server packages
            - pkg: os/exec
              desc: the kernel must not spawn OS processes
            - pkg: modernc.org/sqlite
              desc: the SQLite driver lives in modules/store/sqlite (kernel uses the DBOpener interface)
            - pkg: github.com/tokibase/tokibase/modules
              desc: the kernel must not import modules (modules import the kernel)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - prealloc
formatters:
  enable:
    - gofmt
    - goimports
